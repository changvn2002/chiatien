name: CI

# Cổng chất lượng tự động cho mọi thay đổi (CQ-04 / OPS-01): cùng một
# dãy lệnh phải xanh ở máy dev (xem README mục "Chạy local") và trên CI.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: typecheck / lint / format / test+coverage / build / budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Test + coverage (ngưỡng CQ-06 trong vitest.config.ts)
        run: pnpm test:coverage

      - name: Dependency audit (SEC-10 — chặn khi có lỗ hổng)
        # Audit là cổng chặn thật (SEC-10/CQ-04, sửa theo chấm vòng 4):
        # pnpm audit --prod trả exit code khác 0 khi có advisory ở mức
        # mặc định → job fail, không còn cờ bỏ-qua-lỗi cho bước này.
        run: pnpm audit --prod

      - name: Build
        run: pnpm build

      - name: Kiểm ngân sách JS (PERF-08)
        run: node scripts/check-bundle-budget.mjs

  secret-scan:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

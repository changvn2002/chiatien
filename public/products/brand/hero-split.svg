  <path d="M560 66 L612 56 L620 102 L614 110 L607 103 L600 111 L593 104 L586 111 L579 104 L572 110 L566 104 Z" fill="#FFFFFF" stroke="#212121" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M570 74 Q584 71 602 68 M572 84 Q586 81 600 79" fill="none" stroke="#BDBDBD" stroke-width="2" stroke-linecap="round"/>
  <path d="M576 94 Q590 91 602 90" fill="none" stroke="#FF5722" stroke-width="2.5" stroke-linecap="round"/>
</svg>

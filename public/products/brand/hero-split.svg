  <circle cx="281" cy="54" r="2.6" fill="#212121"/><circle cx="299" cy="54" r="2.6" fill="#212121"/>
  <path d="M281 64 Q290 70 299 64" fill="none" stroke="#212121" stroke-width="2.2" stroke-linecap="round"/>

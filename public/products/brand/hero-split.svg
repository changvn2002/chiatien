  <path d="M586 122 Q592 116 598 122" fill="none" stroke="#212121" stroke-width="2" stroke-linecap="round"/>
  <!-- Chén trà nhỏ -->
  <path d="M636 150 A14 10 0 0 0 664 150 Z" fill="#FFFFFF" stroke="#212121" stroke-width="2.5"/>
  <!-- Đũa gác trên bát phải -->

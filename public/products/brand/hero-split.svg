<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 792 240">
  <!-- CHIATIEN V4-FIX · hero-split 792x240 — BẠN BÈ ĂN CHUNG QUANH BÀN TRÒN, CHIA TIỀN.
       Vẽ tay vector phẳng, không chữ, không ảnh, không filter. Nền trắng, mực #212121,
       xám Material Grey, accent duy nhất #FF5722 ở món ăn chung giữa bàn + biên lai nhỏ.
       Không motif mạch: chỉ dùng circle/ellipse/path, mọi đường đều là đường cong tự nhiên
       (bàn tròn, bát, đầu, tay); không ô vuông, không node, không đường nối thẳng. -->
  <path d="M0 0 H792 V240 H0 Z" fill="#FFFFFF"/>
  <ellipse cx="396" cy="222" rx="310" ry="9" fill="#F5F5F5"/>

  <!-- 4 NGƯỜI (thân sau bàn, đầu tròn, tóc mực, áo xám khác nhau) -->

  <path d="M526 134 L566 124" stroke="#212121" stroke-width="2.5" stroke-linecap="round"/>

  <!-- TAY TRƯỚC BÀN: tay người 1 vươn tới bát, tay người 4 đưa biên lai -->
  <path d="M158 122 Q182 134 200 142 Q206 138 200 132 Q182 124 162 114 Z" fill="#E0E0E0" stroke="#212121" stroke-width="2" stroke-linejoin="round"/>
  <path d="M626 118 Q606 106 596 96 Q590 102 596 110 Q610 120 630 128 Z" fill="#9E9E9E" stroke="#212121" stroke-width="2" stroke-linejoin="round"/>

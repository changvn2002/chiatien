  <!-- Bát phải -->
  <path d="M486 142 A28 20 0 0 0 542 142 Z" fill="#FFFFFF" stroke="#212121" stroke-width="2.5"/>
  <ellipse cx="514" cy="142" rx="28" ry="6" fill="#F5F5F5" stroke="#212121" stroke-width="2"/>
  <path d="M504 138 Q514 132 524 138" fill="none" stroke="#9E9E9E" stroke-width="2" stroke-linecap="round"/>
  <!-- Ấm trà -->
  <path d="M574 138 Q574 122 592 122 Q610 122 610 138 Q610 154 592 154 Q574 154 574 138 Z" fill="#EEEEEE" stroke="#212121" stroke-width="2.5"/>

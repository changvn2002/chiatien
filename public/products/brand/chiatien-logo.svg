<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Chia Tiền — dấu chia">
  <!-- Nền hổ phách đậm, bo góc -->
  <rect x="4" y="4" width="88" height="88" rx="22" fill="#B45309"/>
  <!-- Dấu chia (÷): hai chấm kem và thanh ngang trắng — "chia" theo đúng nghĩa đen -->
  <circle cx="48" cy="31" r="7" fill="#FAECD7"/>
  <rect x="27" y="43.5" width="42" height="9" rx="4.5" fill="#FFFFFF"/>
  <circle cx="48" cy="65" r="7" fill="#FAECD7"/>
</svg>
